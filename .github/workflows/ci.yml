name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cricketos
          POSTGRES_PASSWORD: cricketos
          POSTGRES_DB: cricketos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cricketos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # No real credentials — adapters use mocks / demo
      CRICKETOS_DATA_PROVIDER: demo
      CRICKETOS_LLM_PROVIDER: off
      CRICKETOS_STORAGE_BACKEND: memory
      CRICKETOS_TEST_DATABASE_URL: postgres://cricketos:cricketos@localhost:5432/cricketos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Migrate test database
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.CRICKETOS_TEST_DATABASE_URL }}
      - name: Unit + adapter + ingestion + Postgres tests
        run: npm test
      - name: Build
        run: npm run build
