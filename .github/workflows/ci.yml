name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # No real credentials — adapters use mocks / demo
      CRICKETOS_DATA_PROVIDER: demo
      CRICKETOS_LLM_PROVIDER: off
      CRICKETOS_STORAGE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + adapter + ingestion tests
        run: npm test
      - name: Build
        run: npm run build
